<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — create post</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { max-width: 640px; }
  input, textarea, select {
    width: 100%; margin-bottom: 12px; padding: 8px;
    border: 1px solid #ddd; border-radius: 8px; font-family: inherit;
  }
  button.primary {
    background: #2563eb; color: #fff; border: none;
    padding: 10px 16px; border-radius: 8px; cursor: pointer;
  }
  button.secondary {
    background: #e5e7eb; color: #1a1a1a; border: none;
    padding: 10px 16px; border-radius: 8px; cursor: pointer; margin-right: 8px;
  }
  .post-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  }
  .post-row a { font-size: 13px; color: #555; }
  .delete-btn {
    background: #fee2e2; color: #b91c1c; border: none;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  #token-setup, #cloudinary-setup { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  #upload-status { font-size: 13px; color: #555; margin: -6px 0 12px; }
  #preview-wrap { display: none; background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Admin login</h1>
  <label>Admin token</label>
  <input type="password" id="admin-token" placeholder="Paste your ADMIN_TOKEN">
  <button class="primary" id="login-btn">Unlock dashboard</button>
  <p id="login-error" style="color:#b91c1c; display:none;">Wrong token. Try again.</p>
</div>

<div id="dashboard" style="display:none;">
<header><h1>Admin dashboard</h1></header>

<div id="cloudinary-setup">
  <label>Cloudinary cloud name (one-time setup — see instructions)</label>
  <input type="text" id="cloud-name" placeholder="e.g. dxyz1234">
  <label>Cloudinary unsigned upload preset</label>
  <input type="text" id="upload-preset" placeholder="e.g. social_posts_unsigned">
  <button class="secondary" id="save-cloudinary">Save</button>
</div>

<form id="post-form">
  <label>Title</label>
  <input type="text" name="title" required>
  <label>Body</label>
  <textarea name="body" rows="5" required></textarea>
  <label>Photo or video (optional)</label>
  <input type="file" id="media-file" accept="image/*,video/*">
  <div id="upload-status"></div>
  <input type="hidden" id="media-url">
  <input type="hidden" id="media-type" value="none">
  <button class="primary" type="submit">Preview post</button>
</form>

<div id="preview-wrap">
  <h2>Preview — this is exactly what will go live</h2>
  <div id="preview-card"></div>
  <div style="margin-top:12px;">
    <button class="secondary" id="edit-btn">Edit</button>
    <button class="primary" id="confirm-publish-btn">Confirm &amp; publish</button>
  </div>
</div>

<h2>Existing posts</h2>
<div id="post-list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
