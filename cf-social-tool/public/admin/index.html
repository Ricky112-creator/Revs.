<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body { max-width: 720px; }
  #login-screen { max-width: 360px; margin: 15vh auto 0; text-align: center; }
  #login-screen h1 { font-size: 20px; margin-bottom: 18px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="brand-mark" style="margin: 0 auto 16px;"><i class="ti ti-lock"></i></div>
  <h1>Admin login</h1>
  <label>Admin token</label>
  <input type="password" id="admin-token" placeholder="Paste your ADMIN_TOKEN">
  <button class="primary" id="login-btn" style="width:100%; justify-content:center; margin-top:10px;"><i class="ti ti-key"></i>Unlock dashboard</button>
  <p id="login-error" style="color:#b91c1c; display:none;">Wrong token. Try again.</p>
</div>

<div id="dashboard" style="display:none;">
<header><div class="brand-mark"><i class="ti ti-layout-dashboard"></i></div><h1>Admin dashboard</h1></header>

<nav class="admin-tabs">
  <button class="admin-tab active" data-tab="home"><i class="ti ti-home"></i>Home</button>
  <button class="admin-tab" data-tab="orders"><i class="ti ti-map-pin"></i>Orders</button>
  <button class="admin-tab" data-tab="newpost"><i class="ti ti-plus"></i>New post</button>
  <button class="admin-tab" data-tab="analytics"><i class="ti ti-chart-line"></i>Analytics</button>
  <button class="admin-tab" data-tab="published"><i class="ti ti-clock"></i>Published</button>
</nav>

<div id="tab-home" class="admin-tab-panel">
  <div id="home-content"><p class="muted">Loading...</p></div>
</div>

<div id="tab-orders" class="admin-tab-panel" style="display:none;">
  <h2>Orders</h2>
  <div id="orders-list"><p class="muted">Loading...</p></div>
</div>

<div id="tab-newpost" class="admin-tab-panel" style="display:none;">

<div id="cloudinary-setup">
  <label>Cloudinary cloud name (one-time setup — see instructions)</label>
  <input type="text" id="cloud-name" placeholder="e.g. dxyz1234">
  <label>Cloudinary unsigned upload preset</label>
  <input type="text" id="upload-preset" placeholder="e.g. social_posts_unsigned">
  <button class="secondary" id="save-cloudinary"><i class="ti ti-device-floppy"></i>Save</button>
</div>

<form id="post-form">
  <label>Title</label>
  <input type="text" name="title" required>
  <label>Body</label>
  <textarea name="body" rows="5" required></textarea>
  <label>Photo or video (optional)</label>
  <input type="file" id="media-file" accept="image/*,video/*">
  <div id="upload-status"></div>
  <input type="hidden" id="media-url">
  <input type="hidden" id="media-type" value="none">
  <button class="primary" type="submit"><i class="ti ti-eye"></i>Preview post</button>
</form>

<div id="preview-wrap">
  <h2>Preview — this is exactly what will go live</h2>
  <div id="preview-card"></div>
  <div style="margin-top:12px;">
    <button class="secondary" id="edit-btn"><i class="ti ti-pencil"></i>Edit</button>
    <button class="primary" id="confirm-publish-btn"><i class="ti ti-send"></i>Confirm &amp; publish</button>
  </div>
</div>

</div>

<div id="tab-analytics" class="admin-tab-panel" style="display:none;">
  <h2>Analytics</h2>
  <div id="analytics-content"><p class="muted">Loading...</p></div>
</div>

<div id="tab-published" class="admin-tab-panel" style="display:none;">
  <h2>Published posts</h2>
  <div id="post-list"></div>
</div>

</div>

<script src="app.js"></script>
<script src="orders.js"></script>
<script src="home.js"></script>
<script src="analytics.js"></script>
</body>
</html>
